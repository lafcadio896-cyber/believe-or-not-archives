<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="信じようと、信じまいと―。オリジナルの短編ネットロアを収録する創作アーカイブ。">
  <title>BELIEVE OR NOT ARCHIVES</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-rule" aria-hidden="true"></div>
    <p class="eyebrow">UNVERIFIED RECORDS / EST. 2026</p>
    <h1>BELIEVE OR NOT<br>ARCHIVES</h1>
    <p class="lead">信じようと、信じまいと―</p>
    <p class="notice">ここに収録された記録は、すべて創作である。</p>
  </header>

  <main>
    <section class="controls" aria-label="記録の検索と絞り込み">
      <label class="search-field">
        <span>記録を検索</span>
        <input id="search" type="search" placeholder="地域・年代・記録媒体・語句" autocomplete="off">
      </label>

      <label class="select-field">
        <span>地域</span>
        <select id="region-filter">
          <option value="">すべて</option>
        </select>
      </label>

      <button id="random-button" type="button">無作為に一件</button>
    </section>

    <section class="archive-summary" aria-live="polite">
      <p><span id="visible-count">0</span> / <span id="total-count">0</span> RECORDS</p>
      <div class="summary-rule" aria-hidden="true"></div>
    </section>

    <section id="archive" class="archive-grid" aria-label="収録記録"></section>

    <p id="empty-state" class="empty-state" hidden>条件に一致する記録はない。</p>
  </main>

  <template id="lore-template">
    <article class="lore-card">
      <header class="card-header">
        <div>
          <p class="record-id"></p>
          <h2 class="record-title"></h2>
        </div>
        <time class="record-date"></time>
      </header>

      <dl class="metadata">
        <div><dt>REGION</dt><dd class="record-region"></dd></div>
        <div><dt>ERA</dt><dd class="record-era"></dd></div>
        <div><dt>MEDIUM</dt><dd class="record-medium"></dd></div>
      </dl>

      <div class="lore-body">
        <p class="refrain">信じようと、信じまいと―</p>
        <div class="record-lines"></div>
        <p class="refrain closing">信じようと、信じまいと―</p>
      </div>
    </article>
  </template>

  <footer>
    <p>BELIEVE OR NOT ARCHIVES</p>
    <p>ALL RECORDS ARE FICTIONAL.</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
