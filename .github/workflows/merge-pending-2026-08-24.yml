name: Merge pending lores 2026-08-24

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-pending:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and merge pending lores
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('data/lores.json')
          pending_path = Path('pending/lores-2026-08-24.json')
          archive_path = Path('archive/2026/08/2026-08-24.md')

          data = json.loads(data_path.read_text(encoding='utf-8'))
          pending = json.loads(pending_path.read_text(encoding='utf-8'))
          if len(pending) != 10:
              raise SystemExit(f'expected 10 lores, got {len(pending)}')
          if not archive_path.exists():
              raise SystemExit('archive file is missing')

          existing_ids = [x['id'] for x in data]
          incoming_ids = [x['id'] for x in pending]
          if len(existing_ids) != len(set(existing_ids)):
              raise SystemExit('duplicate IDs already exist in data')
          if len(incoming_ids) != len(set(incoming_ids)):
              raise SystemExit('duplicate IDs exist in pending data')
          overlap = set(existing_ids) & set(incoming_ids)
          if overlap:
              raise SystemExit(f'duplicate incoming IDs: {sorted(overlap)}')
          if any(len(x.get('lines', [])) != 4 for x in pending):
              raise SystemExit('every lore must contain exactly four lines')
          if any(not x['id'].startswith('L-20260824-') for x in pending):
              raise SystemExit('unexpected date in ID')

          data.extend(pending)
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          pending_path.unlink()

          final = json.loads(data_path.read_text(encoding='utf-8'))
          final_ids = [x['id'] for x in final]
          if len(final_ids) != len(set(final_ids)):
              raise SystemExit('duplicate IDs in final data')
          if final_ids[-10:] != incoming_ids:
              raise SystemExit('new lores were not appended at the end')
          PY
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lores.json pending/lores-2026-08-24.json archive/2026/08/2026-08-24.md
          git diff --cached --quiet && exit 0
          git commit -m '2026-08-24のネットロア10件を本体データへ追加'
          git push origin HEAD:main
