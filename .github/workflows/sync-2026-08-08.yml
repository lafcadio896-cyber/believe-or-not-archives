name: Sync 2026-08-08 lores

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-2026-08-08.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append pre-generated lores and validate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data_path = Path('data/lores.json')
          pending_path = Path('pending/lores-2026-08-08.json')
          current = json.loads(data_path.read_text(encoding='utf-8'))
          incoming = json.loads(pending_path.read_text(encoding='utf-8'))
          if not isinstance(incoming, list) or len(incoming) != 10:
              raise SystemExit('pending must contain exactly 10 lores')
          existing_ids = {x['id'] for x in current}
          ids = [x['id'] for x in incoming]
          if len(ids) != len(set(ids)) or existing_ids.intersection(ids):
              raise SystemExit('duplicate ID detected')
          for x in incoming:
              if len(x.get('lines', [])) != 4:
                  raise SystemExit(f"{x.get('id')}: lines must contain exactly 4 items")
          current.extend(incoming)
          all_ids = [x['id'] for x in current]
          if len(all_ids) != len(set(all_ids)):
              raise SystemExit('duplicate IDs after append')
          data_path.write_text(json.dumps(current, ensure_ascii=False, separators=(',', ':')).replace('},{','},\n  {').replace('[{','[\n  {').replace('}]','}\n]') + '\n', encoding='utf-8')
          json.loads(data_path.read_text(encoding='utf-8'))
          print(f'appended={len(incoming)} total={len(current)} last={current[-1]["id"]}')
          PY
      - name: Commit JSON and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lores.json
          git rm pending/lores-2026-08-08.json
          git rm .github/workflows/sync-2026-08-08.yml
          git commit -m "2026-08-08のネットロア10件をJSONへ追加"
          git push origin HEAD:main
