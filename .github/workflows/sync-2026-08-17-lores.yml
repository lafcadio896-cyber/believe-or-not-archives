name: Sync 2026-08-17 lores

on:
  push:
    branches: [main]
    paths:
      - pending/lores-2026-08-17.json

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and append
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data_path = Path('data/lores.json')
          pending_path = Path('pending/lores-2026-08-17.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          incoming = json.loads(pending_path.read_text(encoding='utf-8'))
          if len(incoming) != 10:
              raise SystemExit('expected 10 lores')
          ids = [x['id'] for x in data]
          new_ids = [x['id'] for x in incoming]
          if len(ids) != len(set(ids)) or len(new_ids) != len(set(new_ids)) or set(ids) & set(new_ids):
              raise SystemExit('duplicate ID')
          if any(len(x.get('lines', [])) != 4 for x in incoming):
              raise SystemExit('lines must be exactly 4')
          data.extend(incoming)
          data_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          pending_path.unlink()
          final = json.loads(data_path.read_text(encoding='utf-8'))
          final_ids = [x['id'] for x in final]
          if len(final_ids) != len(set(final_ids)):
              raise SystemExit('duplicate final IDs')
          if any(len(x.get('lines', [])) != 4 for x in final[-10:]):
              raise SystemExit('final lines invalid')
          PY
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lores.json pending/lores-2026-08-17.json
          git commit -m '2026-08-17のネットロア10件を本体データへ追加'
          git push origin HEAD:main
