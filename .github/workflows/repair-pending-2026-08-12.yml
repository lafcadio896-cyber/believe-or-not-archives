name: Repair pending lores 2026-08-12

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-pending:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge pending lores into data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('data/lores.json')
          pending_path = Path('pending/lores-2026-08-12.json')
          if not pending_path.exists():
              raise SystemExit('pending file is absent')

          data = json.loads(data_path.read_text(encoding='utf-8'))
          pending = json.loads(pending_path.read_text(encoding='utf-8'))
          if len(pending) != 10:
              raise SystemExit(f'expected 10 pending lores, got {len(pending)}')
          existing = {x['id'] for x in data}
          incoming = [x['id'] for x in pending]
          if len(incoming) != len(set(incoming)):
              raise SystemExit('duplicate IDs inside pending data')
          dup = existing.intersection(incoming)
          if dup:
              raise SystemExit(f'IDs already exist: {sorted(dup)}')
          if any(len(x.get('lines', [])) != 4 for x in pending):
              raise SystemExit('every lore must have exactly four lines')

          data.extend(pending)
          data_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          pending_path.unlink()

          # Reparse and validate final JSON/IDs.
          final = json.loads(data_path.read_text(encoding='utf-8'))
          ids = [x['id'] for x in final]
          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate IDs in final data')
          PY
      - name: Commit directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lores.json pending/lores-2026-08-12.json
          git diff --cached --quiet && exit 0
          git commit -m '2026-08-12のネットロア10件を本体データへ追加'
          git push origin HEAD:main
