name: Sync lores 2026-08-13

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append validated pending lores
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('data/lores.json')
          pending_path = Path('pending/lores-2026-08-13.json')
          workflow_path = Path('.github/workflows/sync-lores-2026-08-13.yml')

          data = json.loads(data_path.read_text(encoding='utf-8'))
          pending = json.loads(pending_path.read_text(encoding='utf-8'))
          if len(pending) != 10:
              raise SystemExit(f'expected 10 lores, got {len(pending)}')
          if any(len(x.get('lines', [])) != 4 for x in pending):
              raise SystemExit('every lore must have exactly 4 lines')

          current_ids = [x['id'] for x in data]
          incoming_ids = [x['id'] for x in pending]
          if len(current_ids) != len(set(current_ids)):
              raise SystemExit('duplicate IDs already exist in data')
          if len(incoming_ids) != len(set(incoming_ids)):
              raise SystemExit('duplicate IDs in pending')
          overlap = set(current_ids) & set(incoming_ids)
          if overlap:
              raise SystemExit(f'IDs already exist: {sorted(overlap)}')

          data.extend(pending)
          data_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          final = json.loads(data_path.read_text(encoding='utf-8'))
          ids = [x['id'] for x in final]
          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate IDs after append')
          if [x['id'] for x in final[-10:]] != incoming_ids:
              raise SystemExit('new lores are not at JSON tail')

          pending_path.unlink()
          workflow_path.unlink()
          PY
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lores.json pending/lores-2026-08-13.json .github/workflows/sync-lores-2026-08-13.yml
          git commit -m '2026-08-13のネットロア10件を本体データへ追加'
          git push origin HEAD:main
