name: Sync pending lores

on:
  push:
    branches: [main]
    paths:
      - 'pending/lores-*.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and append prepared lores
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data_path = Path('data/lores.json')
          pending = sorted(Path('pending').glob('lores-*.json'))
          if not pending:
              raise SystemExit(0)
          current = json.loads(data_path.read_text(encoding='utf-8'))
          current_ids = {x['id'] for x in current}
          added = 0
          for source in pending:
              incoming = json.loads(source.read_text(encoding='utf-8'))
              if len(incoming) != 10:
                  raise SystemExit(f'{source}: expected 10 entries')
              ids = [x['id'] for x in incoming]
              if len(ids) != len(set(ids)) or current_ids.intersection(ids):
                  raise SystemExit(f'{source}: duplicate IDs')
              for item in incoming:
                  if len(item.get('lines', [])) != 4:
                      raise SystemExit(f"{item.get('id')}: lines must contain exactly 4 items")
              current.extend(incoming)
              current_ids.update(ids)
              added += len(incoming)
              source.unlink()
          encoded = json.dumps(current, ensure_ascii=False, separators=(',', ':'))
          json.loads(encoded)
          data_path.write_text(encoded + '\n', encoding='utf-8')
          print(f'appended={added} total={len(current)}')
          PY
      - name: Commit synchronized JSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lores.json
          git add -u pending
          git diff --cached --quiet && exit 0
          git commit -m "生成済みネットロアを本体JSONへ同期"
          git push origin HEAD:main
