name: Sync lores 2026-08-23

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append generated lores and validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('data/lores.json')
          pending_path = Path('pending/lores-2026-08-23.json')

          data = json.loads(data_path.read_text(encoding='utf-8'))
          incoming = json.loads(pending_path.read_text(encoding='utf-8'))

          if len(incoming) != 10:
              raise SystemExit(f'expected 10 lores, got {len(incoming)}')
          ids = [x['id'] for x in data]
          new_ids = [x['id'] for x in incoming]
          if len(new_ids) != len(set(new_ids)):
              raise SystemExit('duplicate IDs in incoming lores')
          dup = set(ids).intersection(new_ids)
          if dup:
              raise SystemExit(f'IDs already exist: {sorted(dup)}')
          if any(len(x.get('lines', [])) != 4 for x in incoming):
              raise SystemExit('every lore must contain exactly four lines')

          data.extend(incoming)
          data_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          pending_path.unlink()

          final = json.loads(data_path.read_text(encoding='utf-8'))
          final_ids = [x['id'] for x in final]
          if len(final_ids) != len(set(final_ids)):
              raise SystemExit('duplicate IDs in final JSON')
          if final_ids[-10:] != new_ids:
              raise SystemExit('new lores were not appended at the end')
          if any(len(x.get('lines', [])) != 4 for x in final[-10:]):
              raise SystemExit('final lore line-count validation failed')
          PY
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lores.json pending/lores-2026-08-23.json
          git diff --cached --quiet && exit 0
          git commit -m '2026-08-23のネットロア10件を本体データへ追加'
          git push origin HEAD:main
