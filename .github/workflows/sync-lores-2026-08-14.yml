name: Sync lores 2026-08-14

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-lores-2026-08-14.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append validated lores
        env:
          LORES_B64: 
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          data_path = Path('data/lores.json')
          incoming = json.loads(base64.b64decode(os.environ['LORES_B64']).decode('utf-8'))
          data = json.loads(data_path.read_text(encoding='utf-8'))
          assert len(incoming) == 10
          assert all(len(x.get('lines', [])) == 4 for x in incoming)
          old_ids = [x['id'] for x in data]
          new_ids = [x['id'] for x in incoming]
          assert len(old_ids) == len(set(old_ids))
          assert len(new_ids) == len(set(new_ids))
          assert not set(old_ids).intersection(new_ids)
          data.extend(incoming)
          final_ids = [x['id'] for x in data]
          assert len(final_ids) == len(set(final_ids))
          data_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          json.loads(data_path.read_text(encoding='utf-8'))
          PY
      - name: Commit to main and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lores.json
          git rm .github/workflows/sync-lores-2026-08-14.yml
          git commit -m '2026-08-14のネットロア10件を本体データへ追加'
          git push origin HEAD:main
