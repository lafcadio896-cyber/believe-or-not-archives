name: Migrate split lore data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-split-lore-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-split-lore-data
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split legacy JSON into daily canonical files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from datetime import datetime
          from pathlib import Path

          legacy = Path('data/lores.json')
          if not legacy.exists():
              print('legacy data/lores.json already removed; nothing to migrate')
              raise SystemExit(0)

          records = json.loads(legacy.read_text(encoding='utf-8'))
          if not isinstance(records, list) or not records:
              raise SystemExit('legacy lores.json must be a non-empty array')

          required = {'id','published','title','region','era','medium','tags','lines'}
          ids = []
          grouped = defaultdict(list)
          for item in records:
              missing = required.difference(item)
              if missing:
                  raise SystemExit(f"{item.get('id')}: missing {sorted(missing)}")
              if not isinstance(item['lines'], list) or len(item['lines']) != 4:
                  raise SystemExit(f"{item['id']}: lines must contain exactly 4 items")
              datetime.strptime(item['published'], '%Y-%m-%d')
              ids.append(item['id'])
              grouped[item['published']].append(item)

          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate IDs in legacy data')

          files = []
          all_records = []
          for date in sorted(grouped):
              items = sorted(grouped[date], key=lambda x: x['id'])
              year, month, _ = date.split('-')
              path = Path('data') / year / month / f'{date}.json'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(items, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              reparsed = json.loads(path.read_text(encoding='utf-8'))
              if len(reparsed) != len(items):
                  raise SystemExit(f'{path}: reparse count mismatch')
              files.append({
                  'date': date,
                  'path': path.as_posix(),
                  'count': len(items),
                  'first_id': items[0]['id'],
                  'last_id': items[-1]['id'],
              })
              all_records.extend(items)

          all_records = sorted(all_records, key=lambda x: (x['published'], x['id']))
          if len(all_records) != len(records):
              raise SystemExit('split count mismatch')

          latest = all_records[-1]
          index = {
              'version': 1,
              'total': len(all_records),
              'latest_id': latest['id'],
              'latest_published': latest['published'],
              'files': files,
          }
          Path('data/index.json').write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          recent = list(reversed(all_records))[:100]
          Path('data/recent-lores.json').write_text(json.dumps(recent, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          fingerprints = []
          for item in reversed(all_records):
              fingerprints.append({
                  'id': item['id'],
                  'published': item['published'],
                  'title': item['title'],
                  'region': item['region'],
                  'era': item['era'],
                  'medium': item['medium'],
                  'tags': item.get('tags', []),
                  'opening': item['lines'][0],
                  'ending': item['lines'][-1],
              })
          Path('data/fingerprints.json').write_text(json.dumps(fingerprints, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          Path('data/latest-lore.json').write_text(
              json.dumps({'id': latest['id'], 'published': latest['published'], 'count': len(all_records)}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          # Validate generated metadata before removing the legacy source.
          loaded_index = json.loads(Path('data/index.json').read_text(encoding='utf-8'))
          loaded_recent = json.loads(Path('data/recent-lores.json').read_text(encoding='utf-8'))
          loaded_fp = json.loads(Path('data/fingerprints.json').read_text(encoding='utf-8'))
          if loaded_index['total'] != len(all_records):
              raise SystemExit('index total mismatch')
          if len(loaded_recent) != min(100, len(all_records)):
              raise SystemExit('recent count mismatch')
          if len(loaded_fp) != len(all_records):
              raise SystemExit('fingerprint count mismatch')
          if loaded_recent[0]['id'] != latest['id']:
              raise SystemExit('recent latest mismatch')

          legacy.unlink()
          print(f'migrated={len(all_records)} files={len(files)} latest={latest["id"]}')
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m 'ロアデータを日別JSON構成へ完全移行'
          git pull --rebase origin main
          git push origin HEAD:main
