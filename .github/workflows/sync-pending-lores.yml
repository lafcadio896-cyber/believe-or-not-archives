name: Sync pending lores

on:
  push:
    branches: [main]
    paths:
      - 'pending/lores-*.json'
      - '.github/workflows/sync-pending-lores.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and append pending lores
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('data/lores.json')
          pending_paths = sorted(Path('pending').glob('lores-*.json'))
          if not pending_paths:
              raise SystemExit('pending lore file not found')

          current = json.loads(data_path.read_text(encoding='utf-8'))
          current_ids = {item['id'] for item in current}
          incoming = []
          for path in pending_paths:
              values = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(values, list):
                  raise SystemExit(f'{path}: root must be an array')
              for item in values:
                  required = {'id','published','title','region','era','medium','tags','lines'}
                  missing = required.difference(item)
                  if missing:
                      raise SystemExit(f"{item.get('id')}: missing {sorted(missing)}")
                  if not isinstance(item['lines'], list) or len(item['lines']) != 4:
                      raise SystemExit(f"{item['id']}: lines must contain exactly 4 items")
              incoming.extend(values)

          incoming_ids = [item['id'] for item in incoming]
          if len(incoming_ids) != len(set(incoming_ids)):
              raise SystemExit('duplicate IDs inside pending data')
          duplicated = current_ids.intersection(incoming_ids)
          if duplicated:
              raise SystemExit(f'IDs already exist: {sorted(duplicated)}')

          current.extend(incoming)
          all_ids = [item['id'] for item in current]
          if len(all_ids) != len(set(all_ids)):
              raise SystemExit('duplicate IDs after append')

          lines = ['[']
          for i, item in enumerate(current):
              suffix = ',' if i < len(current) - 1 else ''
              lines.append('  ' + json.dumps(item, ensure_ascii=False, separators=(',', ':')) + suffix)
          lines.append(']')
          data_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          reparsed = json.loads(data_path.read_text(encoding='utf-8'))
          if len(reparsed) != len(current):
              raise SystemExit('JSON reparse count mismatch')
          for path in pending_paths:
              path.unlink()
          print(f'appended {len(incoming)} lores; total={len(reparsed)}')
          PY
      - name: Commit synchronized JSON
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lores.json pending/
          git diff --cached --quiet && exit 0
          git commit -m '保留中のネットロアを本体JSONへ同期'
          git push origin HEAD:main
