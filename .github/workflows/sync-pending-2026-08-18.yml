name: Sync pending lores 2026-08-18

on:
  push:
    branches: [main]
    paths:
      - pending/lores-2026-08-18.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and append generated lores
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('data/lores.json')
          pending_path = Path('pending/lores-2026-08-18.json')
          current = json.loads(data_path.read_text(encoding='utf-8'))
          incoming = json.loads(pending_path.read_text(encoding='utf-8'))

          if not isinstance(current, list) or not isinstance(incoming, list):
              raise SystemExit('JSON root must be an array')
          if len(incoming) != 10:
              raise SystemExit(f'expected 10 lores, got {len(incoming)}')

          current_ids = [x['id'] for x in current]
          incoming_ids = [x['id'] for x in incoming]
          if len(current_ids) != len(set(current_ids)):
              raise SystemExit('duplicate IDs already exist in data/lores.json')
          if len(incoming_ids) != len(set(incoming_ids)):
              raise SystemExit('duplicate IDs in incoming lores')
          overlap = set(current_ids) & set(incoming_ids)
          if overlap:
              raise SystemExit(f'IDs already exist: {sorted(overlap)}')

          required = {'id','published','title','region','era','medium','tags','lines'}
          for item in incoming:
              missing = required - set(item)
              if missing:
                  raise SystemExit(f"{item.get('id')}: missing {sorted(missing)}")
              if item['published'] != '2026-08-18':
                  raise SystemExit(f"{item['id']}: wrong published date")
              if not isinstance(item['lines'], list) or len(item['lines']) != 4:
                  raise SystemExit(f"{item['id']}: lines must contain exactly 4 items")

          current.extend(incoming)
          final_ids = [x['id'] for x in current]
          if len(final_ids) != len(set(final_ids)):
              raise SystemExit('duplicate IDs after append')

          data_path.write_text(json.dumps(current, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          json.loads(data_path.read_text(encoding='utf-8'))
          pending_path.unlink()
          PY
      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lores.json
          git rm -f pending/lores-2026-08-18.json
          git rm -f .github/workflows/sync-pending-2026-08-18.yml
          git commit -m "2026-08-18のネットロア10件をJSONへ追加"
          git push origin HEAD:main
